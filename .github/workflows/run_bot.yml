name: Hourly Notice Checker

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ঘণ্টা পর পর ক্লাউডে অটোমেটিক রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python xsjobnotice_bot.py

      - name: Save History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add downloaded_history.txt || true
          git commit -m "Update sent notice history" || echo "No changes to commit"
          git push || true
